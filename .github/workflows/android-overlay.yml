name: Build Android overlay APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-overlay/**"
      - ".github/workflows/android-overlay.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android-overlay :app:assembleDebug
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: roomchat-android-overlay-v1.0.2
          name: RoomChat Android 오버레이 v1.0.2
          prerelease: true
          make_latest: false
          files: android-overlay/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
