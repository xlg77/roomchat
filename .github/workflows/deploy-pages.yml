name: Deploy RoomChat to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax and deep-link fallback
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js social.js soundboard.js fonts.js config.js; do
            node --input-type=module --check < "$file"
          done
          if ! cmp -s index.html 404.html; then
            echo "::error::index.html and 404.html must stay synchronized for room subroutes."
            exit 1
          fi

      - name: Generate version for this deployment
        shell: bash
        run: |
          SHA="${GITHUB_SHA}"
          SHORT="${SHA:0:7}"
          DATE="$(date -u +'%Y.%m.%d')"
          BUILT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{\n  "version": "v%s+%s",\n  "commit": "%s",\n  "deployedAt": "%s"\n}\n' "$DATE" "$SHORT" "$SHA" > version.json
          touch .nojekyll

      - name: Bust cached asset URLs for every deployment
        shell: python
        run: |
          import pathlib
          import re
          import os

          build_id = os.environ["GITHUB_SHA"][:12]
          for path in [*pathlib.Path(".").glob("*.html"), *pathlib.Path(".").glob("*.js"), *pathlib.Path(".").glob("*.css")]:
              content = path.read_text(encoding="utf-8")
              content = re.sub(r"([?&]v=)[^&\s\"'<>)]*", lambda match: match.group(1) + build_id, content)
              path.write_text(content, encoding="utf-8")

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
