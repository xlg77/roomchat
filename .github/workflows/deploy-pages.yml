name: Deploy RoomChat to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate version for this deployment
        shell: bash
        run: |
          SHA="${GITHUB_SHA}"
          SHORT="${SHA:0:7}"
          DATE="$(date -u +'%Y.%m.%d')"
          BUILT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{\n  "version": "v%s+%s",\n  "commit": "%s",\n  "deployedAt": "%s"\n}\n' "$DATE" "$SHORT" "$SHA" > version.json
          touch .nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
